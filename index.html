<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WO PLN Mobile • Petugas Lapangan</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #f1f5f9;
    }
    .pln-gradient {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    }
  </style>
</head>
<body class="text-slate-800 pb-12 min-h-screen flex flex-col">

  <!-- ===================================================================== -->
  <!-- HEADER APLIKASI PETUGAS                                               -->
  <!-- ===================================================================== -->
  <header class="pln-gradient text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-lg mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-extrabold text-lg shadow">
          ⚡
        </div>
        <div>
          <h1 class="font-extrabold text-sm tracking-tight leading-none">WO PLN LAPANGAN</h1>
          <div class="flex items-center gap-1.5 mt-1">
            <span id="connDot" class="w-2 h-2 rounded-full bg-emerald-400"></span>
            <span id="connText" class="text-[11px] text-slate-300 font-medium">● Online • Siap</span>
          </div>
        </div>
      </div>

      <!-- Badge Akun Petugas Aktif -->
      <div id="userBadge" class="hidden flex items-center gap-2">
        <span id="activePetugasLabel" class="font-mono text-xs font-extrabold bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg text-amber-400"></span>
        <button onclick="logoutPetugas()" class="text-xs bg-rose-600 hover:bg-rose-700 active:scale-95 px-2.5 py-1 rounded-lg font-bold transition">
          Keluar
        </button>
      </div>
    </div>
  </header>

  <!-- TOAST NOTIFICATION CONTAINER -->
  <div id="toastContainer" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

  <!-- ===================================================================== -->
  <!-- KONTEN UTAMA                                                          -->
  <!-- ===================================================================== -->
  <main class="max-w-lg w-full mx-auto px-4 mt-5 flex-1">

    <!-- 1. HALAMAN LOGIN PETUGAS -->
    <section id="loginSection" class="bg-white rounded-3xl shadow-sm border border-slate-200 p-6 sm:p-7 mt-4">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-2xl font-extrabold mx-auto mb-3 shadow-inner">
          👷
        </div>
        <h2 class="text-lg font-extrabold text-slate-900">Login Petugas Lapangan</h2>
        <p class="text-xs text-slate-500 mt-1">Pilih user Anda untuk membuka daftar target WO</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label for="loginId" class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">
            PILIH USER
          </label>
          <select id="loginId" required class="w-full px-3.5 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white font-mono font-extrabold text-sm text-slate-900 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition">
            <option value="">-- Pilih User --</option>
          </select>
        </div>

        <div>
          <label for="loginPass" class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-1.5">
            KATA SANDI
          </label>
          <div class="relative">
            <input type="password" id="loginPass" value="Pln@123" required placeholder="Masukkan kata sandi" class="w-full pl-3.5 pr-11 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500 transition" />
            <button type="button" onclick="togglePasswordVisibility()" title="Intip Kata Sandi" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-700 text-base p-1">
              <span id="eyeIcon">👁️</span>
            </button>
          </div>
        </div>

        <button type="submit" class="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 active:scale-[0.99] text-amber-400 font-extrabold text-sm shadow-lg transition">
          Masuk ke Daftar WO ➔
        </button>
      </form>
    </section>

    <!-- 2. DASHBOARD KERJA PETUGAS -->
    <section id="workSection" class="hidden space-y-4">
      <!-- Ringkasan Statistik Target -->
      <div class="grid grid-cols-3 gap-2.5">
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-center">
          <div class="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider">Target</div>
          <div id="pStatTarget" class="text-2xl font-extrabold text-slate-900 mt-0.5">0</div>
        </div>
        <div class="bg-white p-3.5 rounded-2xl border border-emerald-200 shadow-sm text-center">
          <div class="text-[10px] font-extrabold text-emerald-600 uppercase tracking-wider">Selesai</div>
          <div id="pStatSelesai" class="text-2xl font-extrabold text-emerald-600 mt-0.5">0</div>
        </div>
        <div class="bg-white p-3.5 rounded-2xl border border-amber-200 shadow-sm text-center">
          <div class="text-[10px] font-extrabold text-amber-600 uppercase tracking-wider">Sisa</div>
          <div id="pStatSisa" class="text-2xl font-extrabold text-amber-600 mt-0.5">0</div>
        </div>
      </div>

      <!-- Filter Tab Status -->
      <div class="grid grid-cols-3 gap-1.5 bg-slate-200/70 p-1 rounded-xl">
        <button id="tabAll" onclick="setStatusFilter('ALL')" class="py-1.5 rounded-lg text-xs font-extrabold bg-white text-slate-900 shadow-sm transition">
          Semua
        </button>
        <button id="tabBelum" onclick="setStatusFilter('BELUM')" class="py-1.5 rounded-lg text-xs font-extrabold text-slate-600 hover:text-slate-900 transition">
          Belum
        </button>
        <button id="tabSelesai" onclick="setStatusFilter('SELESAI')" class="py-1.5 rounded-lg text-xs font-extrabold text-slate-600 hover:text-slate-900 transition">
          Selesai
        </button>
      </div>

      <!-- Pencarian & Tombol Sync -->
      <div class="flex gap-2">
        <div class="relative flex-1">
          <input type="text" id="searchTarget" oninput="renderPetugasList()" placeholder="Cari IDPEL, Nama, atau Alamat..." class="w-full pl-9 pr-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500" />
          <span class="absolute left-3 top-2.5 text-slate-400 text-sm">🔍</span>
        </div>
        <button onclick="loadPetugasData(true)" class="px-3.5 py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-extrabold shadow-sm active:scale-95 transition shrink-0">
          🔄 Sync
        </button>
      </div>

      <!-- Daftar Kartu Target WO -->
      <div id="targetListContainer" class="space-y-3">
        <div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-400 border border-slate-200">
          Memuat data target...
        </div>
      </div>
    </section>

  </main>

  <!-- ===================================================================== -->
  <!-- MODAL FORM LAPORAN PEKERJAAN                                          -->
  <!-- ===================================================================== -->
  <div id="modalForm" class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 hidden items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 sm:p-6 max-h-[92vh] overflow-y-auto shadow-2xl">
      <!-- Header Modal -->
      <div class="flex items-start justify-between gap-3 pb-3.5 border-b border-slate-100">
        <div>
          <span class="text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-0.5 rounded-md bg-amber-100 text-amber-800">
            Input Realisasi WO
          </span>
          <h3 id="mNama" class="font-extrabold text-base text-slate-900 mt-1.5">-</h3>
          <p id="mDetail" class="text-xs text-slate-500 mt-0.5">-</p>
        </div>
        <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold flex items-center justify-center shrink-0">
          ✕
        </button>
      </div>

      <form onsubmit="submitLaporan(event)" class="space-y-4 mt-4">
        <input type="hidden" id="mIdpel" />
        <input type="hidden" id="mNamaVal" />
        <input type="hidden" id="mAlamatVal" />
        <input type="hidden" id="mTarifVal" />
        <input type="hidden" id="mDayaVal" />

        <!-- 1. PILIH KETERANGAN -->
        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">
            1. Pilih Keterangan Pekerjaan
          </label>
          <div class="space-y-2">
            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50 transition">
              <input type="radio" name="keterangan" value="RATTING PLN MOBILE" required class="w-4 h-4 accent-amber-600" />
              <span class="text-xs font-extrabold text-slate-800">⭐ RATTING PLN MOBILE</span>
            </label>
            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50 transition">
              <input type="radio" name="keterangan" value="TRANSAKSI PLN MOBILE" required class="w-4 h-4 accent-amber-600" />
              <span class="text-xs font-extrabold text-slate-800">💳 TRANSAKSI PLN MOBILE</span>
            </label>
            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50 transition">
              <input type="radio" name="keterangan" value="SOSIALISASI PLN MOBILE" required class="w-4 h-4 accent-amber-600" />
              <span class="text-xs font-extrabold text-slate-800">📢 SOSIALISASI PLN MOBILE</span>
            </label>
          </div>
        </div>

        <!-- 2. FOTO KAMERA / GALERI -->
        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase tracking-wider mb-2">
            2. Foto Dokumentasi (Kamera / Galeri)
          </label>
          <input type="file" id="inputKamera" accept="image/*" capture="environment" class="hidden" onchange="handleFotoSelect(this)" />
          <input type="file" id="inputGaleri" accept="image/*" class="hidden" onchange="handleFotoSelect(this)" />

          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="triggerCamera()" class="py-3 px-3 rounded-xl bg-amber-400 hover:bg-amber-500 active:scale-[0.98] text-slate-950 font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-sm transition">
              📷 Ambil Kamera
            </button>
            <button type="button" onclick="document.getElementById('inputGaleri').click()" class="py-3 px-3 rounded-xl bg-slate-800 hover:bg-slate-900 active:scale-[0.98] text-white font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-sm transition">
              🖼️ Pilih Galeri
            </button>
          </div>

          <!-- Live Camera Fallback (Desktop / Browser Webcam) -->
          <div id="liveCamBox" class="hidden mt-3 p-3 rounded-2xl border border-slate-300 bg-slate-900 text-center">
            <video id="liveCamVideo" autoplay playsinline class="w-full max-h-56 rounded-xl object-cover bg-black mx-auto"></video>
            <div class="flex justify-center gap-2 mt-2.5">
              <button type="button" onclick="snapLiveCam()" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold text-xs shadow">
                📸 Jepret Foto
              </button>
              <button type="button" onclick="stopLiveCam()" class="px-3.5 py-2 rounded-xl bg-slate-700 hover:bg-slate-600 text-white font-bold text-xs">
                Tutup
              </button>
            </div>
            <canvas id="liveCamCanvas" class="hidden"></canvas>
          </div>

          <!-- Preview Hasil Foto -->
          <div id="previewBox" class="hidden mt-3 relative rounded-2xl overflow-hidden border border-slate-200 bg-slate-50 p-2">
            <div class="flex items-center justify-between mb-1.5 px-1">
              <span id="fotoSizeInfo" class="text-[11px] font-bold text-emerald-700">✅ Foto siap dikirim</span>
              <button type="button" onclick="resetFoto()" class="bg-rose-600 hover:bg-rose-700 text-white text-[11px] font-bold px-2.5 py-0.5 rounded-lg shadow-sm">
                Hapus Foto
              </button>
            </div>
            <img id="previewImg" src="" alt="Preview Foto" class="w-full max-h-52 object-contain mx-auto rounded-xl bg-white" />
          </div>
        </div>

        <!-- Tombol Aksi Modal -->
        <div class="pt-3 border-t border-slate-100 flex gap-2.5">
          <button type="button" onclick="closeModal()" class="w-1/3 py-3.5 rounded-xl border border-slate-300 text-slate-600 hover:bg-slate-50 font-bold text-xs transition">
            Batal
          </button>
          <button type="submit" id="btnSubmitLaporan" class="w-2/3 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-lg shadow-emerald-600/20 transition">
            Simpan & Kirim Laporan ✓
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===================================================================== -->
  <!-- JAVASCRIPT LOGIC                                                      -->
  <!-- ===================================================================== -->
  <script>
    // 1. KONFIGURASI SUPABASE (MENGGUNAKAN PUBLISHABLE KEY PROJECT ANDA)
    const SUPABASE_URL = 'https://suutoxvenuuwlpbkblbn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_QTkqhUV8kguwZODdihQn-g_8io8WC7P';
    const supabaseClient = (window.supabase && typeof window.supabase.createClient === 'function')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
      : null;

    // 2. STATE APLIKASI
    let currentPetugas = localStorage.getItem('wo_pln_petugas') || '';
    let myTargets = [];
    let myResults = [];
    let statusFilter = 'ALL';
    let selectedCompressedBlob = null;
    let selectedDataUrl = null;
    let videoStream = null;
    let isSandboxPreview = window.location.protocol === 'blob:' || window.location.hostname.includes('usercontent.goog');

    // Data cadangan lokal untuk pratinjau sandbox jika jaringan diblokir
    const FALLBACK_TARGETS = [
      { id: 1, petugas: '51806.12', idpel: '518060039198', nama: 'SAIFUL', alamat: 'JETAK PACIRAN', tarif: 'R1', daya: '450' },
      { id: 2, petugas: '51806.12', idpel: '518060039201', nama: 'WARSITAH', alamat: 'blimbing', tarif: 'R1', daya: '900' },
      { id: 3, petugas: '51806.12', idpel: '518060039180', nama: 'SAKUR', alamat: 'JETAK PACIRAN', tarif: 'R1', daya: '900' },
      { id: 4, petugas: '51806.12', idpel: '518060039219', nama: 'SISWANDI', alamat: 'blimbing', tarif: 'R1', daya: '900' },
      { id: 5, petugas: '51806.12', idpel: '518060115094', nama: 'SULAN', alamat: 'JETAK PACIRAN', tarif: 'R1', daya: '900' },
      { id: 6, petugas: '51806.14', idpel: '518060359038', nama: 'selamet', alamat: 'JETAK PACIRAN', tarif: 'R1M', daya: '900' },
      { id: 7, petugas: '51806.14', idpel: '518060004668', nama: 'safii', alamat: 'paciran', tarif: 'R1', daya: '900' },
      { id: 8, petugas: '51806.14', idpel: '518060288388', nama: 'sudarman', alamat: 'paciran', tarif: 'R1M', daya: '900' }
    ];

    // 3. POPULATE DROPDOWN KODE (51806.01 - 51806.16 TANPA KATA "PETUGAS")
    const sel = document.getElementById('loginId');
    for (let i = 1; i <= 16; i++) {
      const code = `51806.${String(i).padStart(2, '0')}`;
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = code; // Hanya menampilkan kode 51806.01 s/d 51806.16
      sel.appendChild(opt);
    }

    // 4. NOTIFIKASI TOAST (PENGGANTI ALERT)
    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-500',
        error: 'bg-rose-600 text-white border-rose-500',
        warning: 'bg-amber-400 text-slate-950 border-amber-300',
        info: 'bg-slate-900 text-white border-slate-700'
      };
      const icons = { success: '✅', error: '❌', warning: '⚠️', info: '⚡' };
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-2xl shadow-xl border text-xs font-extrabold transition-all duration-300 ${colors[type] || colors.info}`;
      toast.innerHTML = `<span>${icons[type] || '⚡'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3200);
    }

    // 5. CEK KONEKSI AWAL SUPABASE
    async function checkSupabaseConnection() {
      if (!supabaseClient) {
        document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-rose-500';
        document.getElementById('connText').textContent = 'Pustaka Supabase Gagal Dimuat';
        return;
      }
      document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
      document.getElementById('connText').textContent = '● Online • Siap (Supabase Live)';
    }

    // 6. LOGIN & LOGOUT
    function togglePasswordVisibility() {
      const passInput = document.getElementById('loginPass');
      const eyeIcon = document.getElementById('eyeIcon');
      if (passInput.type === 'password') {
        passInput.type = 'text';
        eyeIcon.textContent = '🙈';
      } else {
        passInput.type = 'password';
        eyeIcon.textContent = '👁️';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value;
      const pass = document.getElementById('loginPass').value;

      if (!id) {
        showToast('Silakan pilih user terlebih dahulu!', 'warning');
        return;
      }
      if (pass !== 'Pln@123') {
        showToast('Kata sandi salah! Gunakan Pln@123.', 'error');
        return;
      }

      currentPetugas = id;
      localStorage.setItem('wo_pln_petugas', id);
      showToast(`Berhasil masuk sebagai ${id}`, 'success');
      initSession();
    }

    function logoutPetugas() {
      localStorage.removeItem('wo_pln_petugas');
      currentPetugas = '';
      document.getElementById('loginPass').value = 'Pln@123';
      document.getElementById('loginPass').type = 'password';
      document.getElementById('eyeIcon').textContent = '👁️';
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('workSection').classList.add('hidden');
      document.getElementById('userBadge').classList.add('hidden');
      showToast('Anda telah keluar.', 'info');
    }

    function initSession() {
      if (!currentPetugas) {
        checkSupabaseConnection();
        return;
      }
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('workSection').classList.remove('hidden');
      document.getElementById('userBadge').classList.remove('hidden');
      document.getElementById('activePetugasLabel').textContent = currentPetugas;
      loadPetugasData(false);
    }

    // 7. AMBIL DATA DARI SUPABASE
    async function loadPetugasData(notify = false) {
      if (!supabaseClient || isSandboxPreview) {
        document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-amber-400';
        document.getElementById('connText').textContent = 'Mode Pratinjau Lokal';
        const cachedT = JSON.parse(localStorage.getItem(`wo_cache_targets_${currentPetugas}`) || 'null');
        myTargets = cachedT && cachedT.length > 0
          ? cachedT
          : FALLBACK_TARGETS.filter(t => t.petugas === currentPetugas);
        myResults = JSON.parse(localStorage.getItem(`wo_cache_results_${currentPetugas}`) || '[]');
        renderPetugasList();
        if (notify) showToast('Data pratinjau lokal dimuat!', 'info');
        return;
      }
      try {
        const [{ data: tData, error: tErr }, { data: rData, error: rErr }] = await Promise.all([
          supabaseClient.from('targets').select('*').eq('petugas', currentPetugas).order('id', { ascending: true }),
          supabaseClient.from('results').select('*').eq('petugas', currentPetugas).order('id', { ascending: false })
        ]);
        if (tErr) throw tErr;
        if (rErr) throw rErr;

        document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
        document.getElementById('connText').textContent = 'Terhubung • Supabase';

        myTargets = tData || [];
        myResults = rData || [];
        try {
          localStorage.setItem(`wo_cache_targets_${currentPetugas}`, JSON.stringify(myTargets));
          localStorage.setItem(`wo_cache_results_${currentPetugas}`, JSON.stringify(myResults));
        } catch (storageErr) {
          // Abaikan jika storage penuh
        }

        renderPetugasList();
        if (notify) showToast('Data berhasil disinkronkan!', 'success');
      } catch (err) {
        document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-amber-400';
        document.getElementById('connText').textContent = 'Offline / Cache Lokal';
        const cachedT = JSON.parse(localStorage.getItem(`wo_cache_targets_${currentPetugas}`) || 'null');
        myTargets = cachedT && cachedT.length > 0
          ? cachedT
          : FALLBACK_TARGETS.filter(t => t.petugas === currentPetugas);
        myResults = JSON.parse(localStorage.getItem(`wo_cache_results_${currentPetugas}`) || '[]');
        renderPetugasList();
        if (notify) showToast('Menampilkan data cache lokal.', 'warning');
      }
    }

    function setStatusFilter(filter) {
      statusFilter = filter;
      const map = { ALL: 'tabAll', BELUM: 'tabBelum', SELESAI: 'tabSelesai' };
      Object.keys(map).forEach(key => {
        const btn = document.getElementById(map[key]);
        if (key === filter) {
          btn.className = 'py-1.5 rounded-lg text-xs font-extrabold bg-white text-slate-900 shadow-sm transition';
        } else {
          btn.className = 'py-1.5 rounded-lg text-xs font-extrabold text-slate-600 hover:text-slate-900 transition';
        }
      });
      renderPetugasList();
    }

    // 8. RENDER DAFTAR TARGET WO
    function renderPetugasList() {
      const doneMap = new Map();
      myResults.forEach(r => doneMap.set(String(r.idpel).trim(), r));

      const total = myTargets.length;
      const selesai = myTargets.filter(t => doneMap.has(String(t.idpel).trim())).length;

      document.getElementById('pStatTarget').textContent = total;
      document.getElementById('pStatSelesai').textContent = selesai;
      document.getElementById('pStatSisa').textContent = Math.max(0, total - selesai);

      const q = document.getElementById('searchTarget').value.toLowerCase().trim();
      const filtered = myTargets.filter(t => {
        const isDone = doneMap.has(String(t.idpel).trim());
        if (statusFilter === 'BELUM' && isDone) return false;
        if (statusFilter === 'SELESAI' && !isDone) return false;
        if (q) {
          const hay = `${t.idpel} ${t.nama} ${t.alamat}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      });

      const container = document.getElementById('targetListContainer');
      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-400 border border-slate-200">
            <div class="text-2xl mb-1.5">📋</div>
            Tidak ada target WO yang sesuai untuk kode <strong class="font-mono text-slate-600">${currentPetugas}</strong>.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const idpelKey = String(item.idpel).trim();
        const res = doneMap.get(idpelKey);
        const isDone = Boolean(res);

        return `
          <div class="bg-white rounded-2xl p-4 border ${isDone ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-200'} shadow-sm transition">
            <div class="flex items-start justify-between gap-3">
              <div class="min-w-0">
                <span class="inline-block font-mono text-[11px] font-extrabold text-slate-600 bg-slate-100 px-2 py-0.5 rounded-md">
                  IDPEL: ${item.idpel}
                </span>
                <h4 class="font-extrabold text-sm text-slate-900 mt-1.5 truncate">${item.nama}</h4>
                <p class="text-xs text-slate-600 mt-0.5 leading-relaxed">${item.alamat}</p>
                <div class="flex flex-wrap gap-1.5 mt-2.5">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">
                    Tarif: ${item.tarif || '-'}
                  </span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">
                    Daya: ${item.daya || '-'} VA
                  </span>
                </div>
              </div>

              ${isDone
                ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-700 text-[11px] font-extrabold shrink-0">✓ Selesai</span>`
                : `<button onclick="openModalByIdpel('${idpelKey}')" class="px-3.5 py-2.5 rounded-xl bg-amber-400 hover:bg-amber-500 active:scale-95 text-slate-950 font-extrabold text-xs shadow-sm shrink-0 transition">Kerjakan ➔</button>`
              }
            </div>

            ${isDone && res
              ? `<div class="mt-3 pt-2.5 border-t border-emerald-100 flex items-center justify-between text-[11px] text-emerald-700 font-bold">
                  <span>Ket: ${res.keterangan}</span>
                  <span class="text-emerald-600/80">${res.waktu || ''}</span>
                </div>`
              : ''
            }
          </div>
        `;
      }).join('');
    }

    // 9. MODAL PENGERJAAN WO
    function openModalByIdpel(idpel) {
      const item = myTargets.find(t => String(t.idpel).trim() === String(idpel).trim());
      if (!item) return;

      document.getElementById('mIdpel').value = item.idpel;
      document.getElementById('mNamaVal').value = item.nama;
      document.getElementById('mAlamatVal').value = item.alamat;
      document.getElementById('mTarifVal').value = item.tarif || '';
      document.getElementById('mDayaVal').value = item.daya || '';

      document.getElementById('mNama').textContent = `${item.nama} (${item.idpel})`;
      document.getElementById('mDetail').textContent = `${item.alamat} • ${item.tarif || '-'}/${item.daya || '-'} VA`;

      document.querySelectorAll('input[name="keterangan"]').forEach(r => r.checked = false);
      resetFoto();

      const modal = document.getElementById('modalForm');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeModal() {
      stopLiveCam();
      const modal = document.getElementById('modalForm');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // 10. KAMERA, GALERI & KOMPRESI JPEG (MAX 1024PX, QUALITY 0.78)
    function resetFoto() {
      selectedCompressedBlob = null;
      selectedDataUrl = null;
      document.getElementById('inputKamera').value = '';
      document.getElementById('inputGaleri').value = '';
      document.getElementById('previewBox').classList.add('hidden');
      document.getElementById('previewImg').src = '';
    }

    async function triggerCamera() {
      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile) {
        document.getElementById('inputKamera').click();
        return;
      }
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        try {
          stopLiveCam();
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'environment' },
            audio: false
          });
          videoStream = stream;
          const video = document.getElementById('liveCamVideo');
          video.srcObject = stream;
          document.getElementById('liveCamBox').classList.remove('hidden');
          document.getElementById('previewBox').classList.add('hidden');
        } catch (err) {
          document.getElementById('inputKamera').click();
        }
      } else {
        document.getElementById('inputKamera').click();
      }
    }

    function snapLiveCam() {
      const video = document.getElementById('liveCamVideo');
      const canvas = document.getElementById('liveCamCanvas');
      if (!video.videoWidth) return;

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(blob => {
        if (!blob) return;
        stopLiveCam();
        compressImageBlob(blob);
      }, 'image/jpeg', 0.85);
    }

    function stopLiveCam() {
      if (videoStream) {
        videoStream.getTracks().forEach(t => t.stop());
        videoStream = null;
      }
      const video = document.getElementById('liveCamVideo');
      if (video) video.srcObject = null;
      document.getElementById('liveCamBox').classList.add('hidden');
    }

    function handleFotoSelect(input) {
      const file = input.files[0];
      if (!file) return;
      stopLiveCam();
      compressImageBlob(file);
    }

    function compressImageBlob(fileOrBlob) {
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const maxW = 1024;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          selectedDataUrl = canvas.toDataURL('image/jpeg', 0.78);
          canvas.toBlob(blob => {
            selectedCompressedBlob = blob;
            const kb = Math.round(blob.size / 1024);
            document.getElementById('fotoSizeInfo').textContent = `✅ Foto siap (${kb} KB)`;
            document.getElementById('previewImg').src = selectedDataUrl;
            document.getElementById('previewBox').classList.remove('hidden');
          }, 'image/jpeg', 0.78);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(fileOrBlob);
    }

    // 11. SUBMIT LAPORAN KE SUPABASE STORAGE & TABEL RESULTS
    async function submitLaporan(e) {
      e.preventDefault();
      const ketEl = document.querySelector('input[name="keterangan"]:checked');
      if (!ketEl) {
        showToast('Pilih keterangan pekerjaan terlebih dahulu!', 'warning');
        return;
      }
      if (!selectedCompressedBlob) {
        showToast('Silakan ambil foto kamera atau pilih dari galeri!', 'warning');
        return;
      }

      const btn = document.getElementById('btnSubmitLaporan');
      btn.disabled = true;
      btn.textContent = 'Mengirim Laporan...';

      const idpel = document.getElementById('mIdpel').value;
      const nowStr = new Date().toLocaleString('id-ID', {
        dateStyle: 'short',
        timeStyle: 'short'
      });

      const newRecord = {
        id: Date.now(),
        waktu: nowStr,
        petugas: currentPetugas,
        idpel: idpel,
        nama: document.getElementById('mNamaVal').value,
        alamat: document.getElementById('mAlamatVal').value,
        tarif: document.getElementById('mTarifVal').value,
        daya: document.getElementById('mDayaVal').value,
        keterangan: ketEl.value,
        foto_url: selectedDataUrl
      };

      try {
        // Coba kirim ke Supabase jika online/tersedia
        if (!isSandboxPreview && supabaseClient) {
          const fileName = `${currentPetugas}_${idpel}_${Date.now()}.jpg`;
          const { error: upErr } = await supabaseClient.storage
            .from('foto_wo')
            .upload(fileName, selectedCompressedBlob, {
              contentType: 'image/jpeg',
              upsert: true
            });

          if (!upErr) {
            const { data: pubData } = supabaseClient.storage.from('foto_wo').getPublicUrl(fileName);
            if (pubData && pubData.publicUrl) {
              newRecord.foto_url = pubData.publicUrl;
            }
          }

          const { id, ...insertPayload } = newRecord;
          await supabaseClient.from('results').insert([insertPayload]);
        }
      } catch (err) {
        console.warn("Jaringan dibatasi, menggunakan penyimpanan lokal:", err.message);
      }

      // Selalu masukkan ke array hasil lokal dan cache agar langsung tampil sukses
      myResults.unshift(newRecord);
      try {
        localStorage.setItem(`wo_cache_results_${currentPetugas}`, JSON.stringify(myResults));
      } catch (e) {}

      showToast('Laporan berhasil dikirim & disimpan!', 'success');
      closeModal();
      renderPetugasList();

      btn.disabled = false;
      btn.textContent = 'Simpan & Kirim Laporan ✓';
    }

    // JALANKAN INISIALISASI SAAT HALAMAN SIAP
    window.addEventListener('DOMContentLoaded', () => {
      initSession();
    });
  </script>
</body>
