<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WO PLN Mobile • Petugas Lapangan</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f1f5f9; }
    .pln-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
  </style>
</head>
<body class="text-slate-800 pb-12">

  <!-- HEADER -->
  <header class="pln-gradient text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-lg mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-9 h-9 rounded-xl bg-amber-400 text-slate-950 flex items-center justify-center font-extrabold text-lg shadow">⚡</div>
        <div>
          <h1 class="font-extrabold text-sm tracking-tight leading-none">WO PLN LAPANGAN</h1>
          <div class="flex items-center gap-1.5 mt-1">
            <span id="connDot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
            <span id="connText" class="text-[11px] text-slate-300 font-medium">Menghubungkan...</span>
          </div>
        </div>
      </div>
      <div id="userBadge" class="hidden flex items-center gap-2">
        <span id="activePetugasLabel" class="text-xs font-bold bg-slate-800 border border-slate-700 px-2.5 py-1 rounded-lg text-amber-400"></span>
        <button onclick="logoutPetugas()" class="text-xs bg-rose-600 hover:bg-rose-700 px-2.5 py-1 rounded-lg font-bold">Keluar</button>
      </div>
    </div>
  </header>

  <main class="max-w-lg mx-auto px-4 mt-5">

    <!-- HALAMAN LOGIN PETUGAS -->
    <section id="loginSection" class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 mt-6">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-amber-100 text-amber-600 rounded-2xl flex items-center justify-center text-2xl font-extrabold mx-auto mb-3">👷</div>
        <h2 class="text-lg font-extrabold text-slate-900">Login Petugas Lapangan</h2>
        <p class="text-xs text-slate-500 mt-1">Pilih ID Petugas Anda untuk melihat target WO</p>
      </div>

      <form onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">ID Petugas</label>
          <select id="loginId" required class="w-full px-3.5 py-3 rounded-xl border border-slate-300 bg-slate-50 font-bold text-sm focus:outline-none focus:border-amber-500">
            <option value="">-- Pilih Kode Petugas --</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1.5">Kata Sandi</label>
          <input type="password" id="loginPass" required placeholder="Masukkan kata sandi" class="w-full px-3.5 py-3 rounded-xl border border-slate-300 bg-slate-50 text-sm focus:outline-none focus:border-amber-500" />
        </div>
        <button type="submit" class="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-amber-400 font-extrabold text-sm shadow transition">
          Masuk ke Daftar WO ➔
        </button>
      </form>
    </section>

    <!-- DASHBOARD KERJA PETUGAS -->
    <section id="workSection" class="hidden space-y-4">
      <!-- Ringkasan Petugas -->
      <div class="grid grid-cols-3 gap-2.5">
        <div class="bg-white p-3.5 rounded-2xl border border-slate-200 shadow-sm text-center">
          <div class="text-[10px] font-bold text-slate-400 uppercase">Target</div>
          <div id="pStatTarget" class="text-xl font-extrabold text-slate-900 mt-0.5">0</div>
        </div>
        <div class="bg-white p-3.5 rounded-2xl border border-emerald-200 shadow-sm text-center">
          <div class="text-[10px] font-bold text-emerald-600 uppercase">Selesai</div>
          <div id="pStatSelesai" class="text-xl font-extrabold text-emerald-600 mt-0.5">0</div>
        </div>
        <div class="bg-white p-3.5 rounded-2xl border border-amber-200 shadow-sm text-center">
          <div class="text-[10px] font-bold text-amber-600 uppercase">Sisa</div>
          <div id="pStatSisa" class="text-xl font-extrabold text-amber-600 mt-0.5">0</div>
        </div>
      </div>

      <!-- Pencarian & Refresh -->
      <div class="flex gap-2">
        <input type="text" id="searchTarget" oninput="renderPetugasList()" placeholder="Cari IDPEL atau Nama..." class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:border-amber-500" />
        <button onclick="loadPetugasData()" class="px-3.5 py-2.5 rounded-xl bg-slate-900 text-white text-xs font-bold shadow-sm active:scale-95">🔄 Sync</button>
      </div>

      <!-- Daftar Target WO -->
      <div id="targetListContainer" class="space-y-3">
        <div class="text-center py-10 text-xs text-slate-400">Memuat data target...</div>
      </div>
    </section>

  </main>

  <!-- MODAL FORM LAPORAN -->
  <div id="modalForm" class="fixed inset-0 bg-slate-950/75 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-5 max-h-[92vh] overflow-y-auto shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <div>
          <span class="text-[10px] font-extrabold uppercase tracking-wider px-2 py-0.5 rounded bg-amber-100 text-amber-800">Input Realisasi WO</span>
          <h3 id="mNama" class="font-extrabold text-base text-slate-900 mt-1">-</h3>
          <p id="mDetail" class="text-xs text-slate-500">-</p>
        </div>
        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 font-bold">✕</button>
      </div>

      <form onsubmit="submitLaporan(event)" class="space-y-4 mt-4">
        <input type="hidden" id="mIdpel" />
        <input type="hidden" id="mNamaVal" />
        <input type="hidden" id="mAlamatVal" />
        <input type="hidden" id="mTarifVal" />
        <input type="hidden" id="mDayaVal" />

        <!-- 1. PILIH KETERANGAN -->
        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2">1. Pilih Keterangan Pekerjaan</label>
          <div class="space-y-2">
            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
              <input type="radio" name="keterangan" value="RATTING PLN MOBILE" required class="w-4 h-4 accent-amber-600" />
              <span class="text-xs font-bold text-slate-800">RATTING PLN MOBILE</span>
            </label>
            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
              <input type="radio" name="keterangan" value="TRANSAKSI PLN MOBILE" required class="w-4 h-4 accent-amber-600" />
              <span class="text-xs font-bold text-slate-800">TRANSAKSI PLN MOBILE</span>
            </label>
            <label class="flex items-center gap-3 p-3 rounded-xl border border-slate-200 cursor-pointer hover:bg-amber-50/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-50">
              <input type="radio" name="keterangan" value="SOSIALISASI PLN MOBILE" required class="w-4 h-4 accent-amber-600" />
              <span class="text-xs font-bold text-slate-800">SOSIALISASI PLN MOBILE</span>
            </label>
          </div>
        </div>

        <!-- 2. FOTO KAMERA / GALERI -->
        <div>
          <label class="block text-xs font-extrabold text-slate-700 uppercase mb-2">2. Foto Dokumentasi (Kamera / Galeri)</label>
          <input type="file" id="inputKamera" accept="image/*" capture="environment" class="hidden" onchange="handleFotoSelect(this)" />
          <input type="file" id="inputGaleri" accept="image/*" class="hidden" onchange="handleFotoSelect(this)" />

          <div class="grid grid-cols-2 gap-2.5">
            <button type="button" onclick="document.getElementById('inputKamera').click()" class="py-3 px-3 rounded-xl bg-amber-500 hover:bg-amber-600 text-slate-950 font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-sm">
              📷 Ambil Kamera
            </button>
            <button type="button" onclick="document.getElementById('inputGaleri').click()" class="py-3 px-3 rounded-xl bg-slate-800 hover:bg-slate-900 text-white font-extrabold text-xs flex items-center justify-center gap-1.5 shadow-sm">
              🖼️ Pilih Galeri
            </button>
          </div>

          <div id="previewBox" class="hidden mt-3 relative rounded-2xl overflow-hidden border border-slate-200 bg-slate-50">
            <img id="previewImg" src="" class="w-full max-h-56 object-contain mx-auto" />
            <button type="button" onclick="resetFoto()" class="absolute top-2 right-2 bg-rose-600 text-white text-[11px] font-bold px-2.5 py-1 rounded-lg shadow">Hapus Foto</button>
          </div>
        </div>

        <div class="pt-2 flex gap-2">
          <button type="button" onclick="closeModal()" class="w-1/3 py-3.5 rounded-xl border border-slate-300 text-slate-600 font-bold text-xs">Batal</button>
          <button type="submit" id="btnSubmitLaporan" class="w-2/3 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold text-xs shadow-lg">
            Simpan & Kirim Laporan ✓
          </button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // KONFIGURASI SUPABASE PROJECT ANDA
    const SUPABASE_URL = 'https://suutoxvenuuwlpbkblbn.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1dXRveHZlbnV1d2xwYmtibGJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU2MTk1MjcsImV4cCI6MjA5MTE5NTUyN30.88x5n1G442A7L5H3G57v0175c749e144b9124653928';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentPetugas = localStorage.getItem('wo_pln_petugas') || '';
    let myTargets = [];
    let myResults = [];
    let selectedCompressedBlob = null;

    // Isi dropdown 16 petugas
    const sel = document.getElementById('loginId');
    for (let i = 1; i <= 16; i++) {
      const code = `51806.${String(i).padStart(2, '0')}`;
      const opt = document.createElement('option');
      opt.value = code;
      opt.textContent = `Petugas ${code}`;
      sel.appendChild(opt);
    }

    function handleLogin(e) {
      e.preventDefault();
      const id = document.getElementById('loginId').value;
      const pass = document.getElementById('loginPass').value;
      if (pass !== 'Pln@123') {
        alert('Kata sandi salah! Gunakan sandi petugas yang benar.');
        return;
      }
      currentPetugas = id;
      localStorage.setItem('wo_pln_petugas', id);
      initSession();
    }

    function logoutPetugas() {
      localStorage.removeItem('wo_pln_petugas');
      currentPetugas = '';
      document.getElementById('loginSection').classList.remove('hidden');
      document.getElementById('workSection').classList.add('hidden');
      document.getElementById('userBadge').classList.add('hidden');
    }

    function initSession() {
      if (!currentPetugas) return;
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('workSection').classList.remove('hidden');
      document.getElementById('userBadge').classList.remove('hidden');
      document.getElementById('activePetugasLabel').textContent = currentPetugas;
      loadPetugasData();
    }

    async function loadPetugasData() {
      try {
        const [{ data: tData, error: tErr }, { data: rData, error: rErr }] = await Promise.all([
          db.from('targets').select('*').eq('petugas', currentPetugas),
          db.from('results').select('*').eq('petugas', currentPetugas)
        ]);
        if (tErr) throw tErr;
        if (rErr) throw rErr;

        document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-emerald-400';
        document.getElementById('connText').textContent = 'Terhubung • Supabase';

        myTargets = tData || [];
        myResults = rData || [];
        renderPetugasList();
      } catch (err) {
        document.getElementById('connDot').className = 'w-2 h-2 rounded-full bg-rose-500';
        document.getElementById('connText').textContent = 'Gagal Koneksi';
        console.error(err);
      }
    }

    function renderPetugasList() {
      const doneSet = new Set(myResults.map(r => String(r.idpel).trim()));
      const total = myTargets.length;
      const selesai = myTargets.filter(t => doneSet.has(String(t.idpel).trim())).length;

      document.getElementById('pStatTarget').textContent = total;
      document.getElementById('pStatSelesai').textContent = selesai;
      document.getElementById('pStatSisa').textContent = Math.max(0, total - selesai);

      const q = document.getElementById('searchTarget').value.toLowerCase();
      const filtered = myTargets.filter(t =>
        String(t.idpel).toLowerCase().includes(q) ||
        String(t.nama).toLowerCase().includes(q) ||
        String(t.alamat).toLowerCase().includes(q)
      );

      const container = document.getElementById('targetListContainer');
      if (filtered.length === 0) {
        container.innerHTML = `<div class="bg-white rounded-2xl p-8 text-center text-xs text-slate-400 border border-slate-200">Tidak ada target WO untuk petugas ${currentPetugas}.</div>`;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const isDone = doneSet.has(String(item.idpel).trim());
        const res = myResults.find(r => String(r.idpel).trim() === String(item.idpel).trim());
        return `
          <div class="bg-white rounded-2xl p-4 border ${isDone ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-200'} shadow-sm">
            <div class="flex items-start justify-between gap-2">
              <div>
                <span class="text-[11px] font-extrabold text-slate-500 tracking-wide">IDPEL: ${item.idpel}</span>
                <h4 class="font-extrabold text-sm text-slate-900 mt-0.5">${item.nama}</h4>
                <p class="text-xs text-slate-600 mt-0.5">${item.alamat}</p>
                <div class="flex gap-2 mt-2">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">Tarif: ${item.tarif || '-'}</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-slate-100 text-slate-700">Daya: ${item.daya || '-'} VA</span>
                </div>
              </div>
              ${isDone
                ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-100 text-emerald-700 text-[11px] font-extrabold shrink-0">✓ Selesai</span>`
                : `<button onclick='openModal(${JSON.stringify(item).replace(/'/g, "&#39;")})' class="px-3.5 py-2 rounded-xl bg-amber-400 hover:bg-amber-500 text-slate-950 font-extrabold text-xs shadow-sm shrink-0">Kerjakan ➔</button>`
              }
            </div>
            ${isDone && res ? `<div class="mt-2.5 pt-2 border-t border-emerald-100 text-[11px] text-emerald-700 font-semibold">Ket: ${res.keterangan} • ${res.waktu}</div>` : ''}
          </div>
        `;
      }).join('');
    }

    function openModal(item) {
      document.getElementById('mIdpel').value = item.idpel;
      document.getElementById('mNamaVal').value = item.nama;
      document.getElementById('mAlamatVal').value = item.alamat;
      document.getElementById('mTarifVal').value = item.tarif || '';
      document.getElementById('mDayaVal').value = item.daya || '';
      document.getElementById('mNama').textContent = `${item.nama} (${item.idpel})`;
      document.getElementById('mDetail').textContent = `${item.alamat} • ${item.tarif}/${item.daya}`;
      document.querySelectorAll('input[name="keterangan"]').forEach(r => r.checked = false);
      resetFoto();
      document.getElementById('modalForm').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalForm').classList.add('hidden');
    }

    function resetFoto() {
      selectedCompressedBlob = null;
      document.getElementById('inputKamera').value = '';
      document.getElementById('inputGaleri').value = '';
      document.getElementById('previewBox').classList.add('hidden');
      document.getElementById('previewImg').src = '';
    }

    function handleFotoSelect(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function (ev) {
        const img = new Image();
        img.onload = function () {
          const canvas = document.createElement('canvas');
          const maxW = 1024;
          const scale = img.width > maxW ? maxW / img.width : 1;
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          canvas.toBlob(blob => {
            selectedCompressedBlob = blob;
            document.getElementById('previewImg').src = URL.createObjectURL(blob);
            document.getElementById('previewBox').classList.remove('hidden');
          }, 'image/jpeg', 0.78);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    async function submitLaporan(e) {
      e.preventDefault();
      const ketEl = document.querySelector('input[name="keterangan"]:checked');
      if (!ketEl) return alert('Pilih keterangan pekerjaan!');
      if (!selectedCompressedBlob) return alert('Silakan ambil foto kamera atau pilih dari galeri!');

      const btn = document.getElementById('btnSubmitLaporan');
      btn.disabled = true;
      btn.textContent = 'Mengirim ke Server...';

      try {
        const idpel = document.getElementById('mIdpel').value;
        const fileName = `${currentPetugas}_${idpel}_${Date.now()}.jpg`;

        const { error: upErr } = await db.storage.from('foto_wo').upload(fileName, selectedCompressedBlob, {
          contentType: 'image/jpeg',
          upsert: true
        });
        if (upErr) throw upErr;

        const { data: pubData } = db.storage.from('foto_wo').getPublicUrl(fileName);
        const nowStr = new Date().toLocaleString('id-ID', { dateStyle: 'short', timeStyle: 'short' });

        const { error: insErr } = await db.from('results').insert([{
          waktu: nowStr,
          petugas: currentPetugas,
          idpel: idpel,
          nama: document.getElementById('mNamaVal').value,
          alamat: document.getElementById('mAlamatVal').value,
          tarif: document.getElementById('mTarifVal').value,
          daya: document.getElementById('mDayaVal').value,
          keterangan: ketEl.value,
          foto_url: pubData.publicUrl
        }]);
        if (insErr) throw insErr;

        alert('Laporan berhasil terkirim!');
        closeModal();
        await loadPetugasData();
      } catch (err) {
        alert('Gagal mengirim laporan: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = 'Simpan & Kirim Laporan ✓';
      }
    }

    initSession();
  </script>
</body>
</html>
