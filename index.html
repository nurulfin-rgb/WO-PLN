<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WO PLN - Petugas Lapangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-slate-100 min-h-screen pb-12 font-sans">

    <!-- LOGIN SCREEN -->
    <div id="loginSection" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-3xl shadow-xl w-full max-w-md p-8 border border-slate-200">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-20 h-20 bg-amber-400 rounded-2xl text-slate-900 font-black text-3xl mb-4 shadow-lg shadow-amber-400/30">⚡</div>
                <h1 class="text-2xl font-black text-slate-800 tracking-tight">WO PLN PETUGAS</h1>
                <p class="text-sm text-slate-500 mt-1">Aplikasi Lapangan 16 Unit</p>
            </div>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Pilih ID Petugas</label>
                    <select id="loginPetugas" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-400 bg-slate-50 font-medium text-slate-800">
                        <option value="">-- Pilih ID (51806.01 - 16) --</option>
                        <script>
                            for(let i=1; i<=16; i++) {
                                let num = i < 10 ? '0' + i : i;
                                document.write(`<option value="51806.${num}">51806.${num}</option>`);
                            }
                        </script>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-600 mb-1.5">Password</label>
                    <input type="password" id="loginPassword" value="Pln@123" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-amber-400 bg-slate-50 font-medium text-slate-800">
                </div>
                <button type="submit" class="w-full bg-slate-900 text-amber-400 font-bold py-3.5 rounded-xl hover:bg-slate-800 transition shadow-lg shadow-slate-900/20 mt-2">
                    MASUK APLIKASI
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN -->
    <div id="appSection" class="hidden">
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-4 py-3.5 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <span class="text-2xl bg-amber-400 p-2 rounded-xl text-slate-900 font-bold">⚡</span>
                    <div>
                        <h1 class="font-black tracking-tight text-base sm:text-lg">WO PLN LAPANGAN</h1>
                        <p class="text-xs text-amber-400 font-semibold" id="activeUserBadge">-</p>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="downloadExcelPetugas()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow">
                        📥 Unduh Excel
                    </button>
                    <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3.5 py-2 rounded-xl transition shadow">
                        Keluar
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 mt-6">
            <div class="grid grid-cols-3 gap-3 bg-white p-5 rounded-2xl shadow-sm border border-slate-200 mb-6 text-center">
                <div>
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Total Target</p>
                    <p id="statTarget" class="text-2xl font-black text-slate-800 mt-1">0 IDPEL</p>
                </div>
                <div class="border-x border-slate-100">
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Selesai</p>
                    <p id="statSelesai" class="text-2xl font-black text-emerald-600 mt-1">0</p>
                </div>
                <div>
                    <p class="text-xs text-slate-500 uppercase font-bold tracking-wider">Belum</p>
                    <p id="statBelum" class="text-2xl font-black text-amber-600 mt-1">0</p>
                </div>
            </div>

            <div class="flex justify-between items-center mb-5">
                <h2 class="font-black text-slate-800 text-lg">Daftar Penugasan Anda</h2>
                <select id="filterStatus" onchange="renderList()" class="bg-white border border-slate-300 text-sm font-semibold rounded-xl px-4 py-2.5 shadow-sm">
                    <option value="ALL">Semua Status</option>
                    <option value="SELESAI">Selesai</option>
                    <option value="BELUM">Belum</option>
                </select>
            </div>

            <div id="targetListContainer" class="space-y-3.5"></div>
        </main>
    </div>

    <!-- MODAL KERJAKAN -->
    <div id="modalKerjakan" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 overflow-y-auto">
        <div class="bg-white rounded-3xl w-full max-w-lg p-6 sm:p-8 shadow-2xl my-auto">
            <div class="flex justify-between items-center mb-5 border-b pb-3.5">
                <h3 class="font-black text-xl text-slate-800">Form Laporan Lapangan</h3>
                <button onclick="closeModal()" class="text-slate-400 text-2xl font-bold">&times;</button>
            </div>
            <form onsubmit="submitLaporan(event)" class="space-y-4">
                <input type="hidden" id="modalIdpel">
                <div class="bg-slate-50 p-4 rounded-2xl border text-sm space-y-1.5">
                    <p class="text-xs font-bold text-amber-600 uppercase">Detail Pelanggan</p>
                    <p class="font-black text-slate-800 text-base" id="lblNama">-</p>
                    <p class="text-xs font-mono text-slate-500">IDPEL: <span id="lblIdpel" class="font-bold">-</span></p>
                    <p class="text-xs text-slate-600">Alamat: <span id="lblAlamat" class="font-medium">-</span></p>
                    <p class="text-xs text-slate-600">Tarif/Daya: <span id="lblTarifDaya" class="font-medium">-</span></p>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-700 mb-1.5">Keterangan / Status Pekerjaan</label>
                    <select id="inputKeterangan" required class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 font-medium text-sm">
                        <option value="">-- Pilih Keterangan WO --</option>
                        <option value="RATTING PLN MOBILE">RATTING PLN MOBILE</option>
                        <option value="TRANSAKSI PLN MOBILE">TRANSAKSI PLN MOBILE</option>
                        <option value="SOSIALISASI PLN MOBILE">SOSIALISASI PLN MOBILE</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase text-slate-700 mb-1.5">Foto Dokumentasi (Kamera / Galeri)</label>
                    <input type="file" id="inputFoto" accept="image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-400 file:text-slate-900 border rounded-xl bg-slate-50 cursor-pointer">
                </div>
                <div class="flex justify-end space-x-3 pt-4 border-t">
                    <button type="button" onclick="closeModal()" class="px-5 py-3 border rounded-xl text-slate-600 text-sm font-bold">Batal</button>
                    <button type="submit" id="btnSimpan" class="px-6 py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-sm shadow">Simpan Laporan</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL FOTO -->
    <div id="modalFoto" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="relative max-w-xl w-full bg-slate-900 rounded-2xl p-3 text-center border border-slate-800">
            <button onclick="document.getElementById('modalFoto').classList.add('hidden')" class="absolute top-4 right-4 bg-white/20 text-white rounded-full w-9 h-9 font-black">&times;</button>
            <img id="previewFotoFull" src="" class="max-h-[80vh] mx-auto rounded-xl object-contain">
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://suutoxvenuuwlpbkblbn.supabase.co";
        const SUPABASE_KEY = "sb_publishable_QTkqhUV8kguwZODdihQn-g_8io8WC7P";
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentPetugas = localStorage.getItem('p_user') || null;
        let targets = [], results = [];

        window.onload = async function() {
            if(currentPetugas) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('appSection').classList.remove('hidden');
                document.getElementById('activeUserBadge').innerText = currentPetugas + ' • Online';
                await fetchData();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const p = document.getElementById('loginPetugas').value;
            const pass = document.getElementById('loginPassword').value;
            if(pass !== 'Pln@123') { alert('Password salah! Gunakan Pln@123'); return; }
            localStorage.setItem('p_user', p);
            currentPetugas = p;
            location.reload();
        }

        function handleLogout() {
            localStorage.removeItem('p_user');
            location.reload();
        }

        async function fetchData() {
            const { data: t } = await sb.from('targets').select('*').eq('petugas', currentPetugas);
            const { data: r } = await sb.from('results').select('*').eq('petugas', currentPetugas);
            targets = t || [];
            results = r || [];
            renderList();
        }

        function renderList() {
            const container = document.getElementById('targetListContainer');
            const filter = document.getElementById('filterStatus').value;
            container.innerHTML = '';
            
            let selesai = results.length;
            let belum = targets.length - selesai;
            document.getElementById('statTarget').innerText = targets.length + ' IDPEL';
            document.getElementById('statSelesai').innerText = selesai;
            document.getElementById('statBelum').innerText = belum < 0 ? 0 : belum;

            if(targets.length === 0) {
                container.innerHTML = `<div class="bg-white p-8 rounded-2xl text-center text-slate-400 border">Belum ada target untuk Anda.</div>`;
                return;
            }

            targets.forEach(t => {
                const finished = results.find(r => r.idpel === t.idpel);
                const status = finished ? 'SELESAI' : 'BELUM';
                if(filter !== 'ALL' && filter !== status) return;

                if(finished) {
                    container.innerHTML += `
                    <div class="bg-white rounded-2xl p-5 border border-emerald-200 shadow-sm flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-black uppercase bg-emerald-100 text-emerald-700 px-2.5 py-1 rounded-md">✔ SELESAI</span>
                            <p class="text-xs font-mono text-slate-400 mt-1">${finished.idpel}</p>
                            <h3 class="font-black text-slate-800 text-base">${finished.nama}</h3>
                            <p class="text-xs text-slate-500">${finished.alamat} • ${finished.tarif}/${finished.daya} VA</p>
                            <p class="text-xs text-emerald-600 font-bold mt-1">${finished.keterangan} (${finished.waktu})</p>
                        </div>
                        <button onclick="document.getElementById('previewFotoFull').src='${finished.foto_url}'; document.getElementById('modalFoto').classList.remove('hidden'); document.getElementById('modalFoto').classList.add('flex');" class="bg-emerald-50 text-emerald-800 text-xs font-bold px-3.5 py-2 rounded-xl border border-emerald-300">🖼️ Foto</button>
                    </div>`;
                } else {
                    container.innerHTML += `
                    <div class="bg-white rounded-2xl p-5 border border-amber-200 shadow-sm flex justify-between items-center">
                        <div>
                            <span class="text-[10px] font-black uppercase bg-amber-100 text-amber-700 px-2.5 py-1 rounded-md">⏳ BELUM</span>
                            <p class="text-xs font-mono text-slate-400 mt-1">${t.idpel}</p>
                            <h3 class="font-black text-slate-800 text-base">${t.nama}</h3>
                            <p class="text-xs text-slate-500">${t.alamat} • ${t.tarif}/${t.daya} VA</p>
                        </div>
                        <button onclick="openModal('${t.idpel}')" class="bg-sky-600 hover:bg-sky-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow">Kerjakan ➔</button>
                    </div>`;
                }
            });
        }

        function openModal(idpel) {
            const t = targets.find(item => item.idpel === idpel);
            document.getElementById('modalIdpel').value = t.idpel;
            document.getElementById('lblIdpel').innerText = t.idpel;
            document.getElementById('lblNama').innerText = t.nama;
            document.getElementById('lblAlamat').innerText = t.alamat;
            document.getElementById('lblTarifDaya').innerText = t.tarif + ' / ' + t.daya + ' VA';
            document.getElementById('modalKerjakan').classList.remove('hidden');
            document.getElementById('modalKerjakan').classList.add('flex');
        }

        function closeModal() {
            document.getElementById('modalKerjakan').classList.remove('flex');
            document.getElementById('modalKerjakan').classList.add('hidden');
        }

        async function submitLaporan(e) {
            e.preventDefault();
            const idpel = document.getElementById('modalIdpel').value;
            const keterangan = document.getElementById('inputKeterangan').value;
            const file = document.getElementById('inputFoto').files[0];
            const t = targets.find(item => item.idpel === idpel);
            const btn = document.getElementById('btnSimpan');

            btn.innerText = 'Mengunggah...';
            btn.disabled = true;

            try {
                const ext = file.name.split('.').pop();
                const path = `${currentPetugas}_${idpel}_${Date.now()}.${ext}`;
                await sb.storage.from('foto_wo').upload(path, file);
                const { data: urlData } = sb.storage.from('foto_wo').getPublicUrl(path);

                const waktu = new Date().toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' });
                await sb.from('results').insert([{
                    waktu, petugas: currentPetugas, idpel: t.idpel, nama: t.nama, alamat: t.alamat, tarif: t.tarif, daya: t.daya, keterangan, foto_url: urlData.publicUrl
                }]);

                alert('Berhasil disimpan!');
                closeModal();
                await fetchData();
            } catch(err) {
                alert('Gagal: ' + err.message);
            } finally {
                btn.innerText = 'Simpan Laporan';
                btn.disabled = false;
            }
        }

        function downloadExcelPetugas() {
            if(results.length === 0) { alert('Belum ada data.'); return; }
            const ws = XLSX.utils.json_to_sheet(results);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Laporan");
            XLSX.writeFile(wb, `Laporan_${currentPetugas}.xlsx`);
        }
    </script>
</body>
</html>
